events {}
http {
  upstream api {
    # Passive health checking: after one failed attempt an instance is skipped for 10 s, then probed again by a real request.
    server api-1:8080 max_fails=1 fail_timeout=10s;
    server api-2:8080 max_fails=1 fail_timeout=10s;
  }
  server {
    listen 80;

    # Metrics are for the monitoring system inside the network (scrape api-1:8080/metrics and api-2:8080/metrics directly),
    # never for the public internet.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;

      # Failover. Without a connect timeout nginx waits its 60 s default for a dead instance, and measured it: the first request
      # after an instance stopped hung for 38.6 s before moving on. A healthy instance accepts a connection in milliseconds,
      # so 2 s is generous. A request is retried on the other instance ONLY when the connection failed (nothing was sent yet);
      # once a POST has been sent it is never replayed (the supplier's own retry is safe: ingest is idempotent).
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }
  }
}
